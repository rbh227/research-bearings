<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="split-title split-desc">
      <title id="split-title">The tool split</title>
      <desc id="split-desc">Two zones. Research agents read the indexes and write under research/; their only shell command is the retrieval script, so they cannot run an experiment. Experiment agents run code against data and log to the notebook; they have no web tools, so they cannot go find a paper that agrees with a result. A PreToolUse hook enforces the wall.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    .node-name { font: 600 12px 'Geist', sans-serif; fill: #2d3142; text-anchor: middle; }
    .sublabel { font: 9px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; }
    .tag { font: 7px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.08em; }
    .arrow-label { font: 8px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.08em; }
    .zone-label { font: 7px 'Geist Mono', monospace; fill: rgba(45,49,66,0.55); text-anchor: middle; letter-spacing: 0.14em; }
    .legend { font: 8.5px 'Geist', sans-serif; fill: #4f5d75; }
    .legend-head { font: 8px 'Geist Mono', monospace; fill: #4f5d75; letter-spacing: 0.18em; }
    .ring { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
    .spoke { fill: none; stroke: #7a8399; stroke-width: 1; stroke-dasharray: 5,4; }
    .station { fill: #ffffff; stroke: #2d3142; stroke-width: 1; }
    .hub { fill: #2d3142; }
    .hub-name { font: 600 13px 'Geist', sans-serif; fill: #f5f5f5; text-anchor: middle; }
    .hub-sub { font: 9px 'Geist Mono', monospace; fill: rgba(245,245,245,0.75); text-anchor: middle; }
    .flow { fill: none; stroke: #4f5d75; stroke-width: 1.2; }</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="1000" height="420" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="40" y="64" width="408" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="96" y="68" width="296" height="12" rx="2" fill="#f5f5f5"/>
      <text x="244" y="77" class="zone-label">RESEARCH AGENTS · READ THE WORLD · NO CODE</text>
      <rect x="552" y="64" width="408" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="612" y="68" width="288" height="12" rx="2" fill="#f5f5f5"/>
      <text x="756" y="77" class="zone-label">EXPERIMENT AGENTS · RUN CODE · NO WEB</text>

      <!-- Arrows first: each agent box to the two things it may touch -->
      <line class="flow" x1="152" y1="168" x2="152" y2="232" marker-end="url(#arrow)"/>
      <line class="flow" x1="336" y1="168" x2="336" y2="232" marker-end="url(#arrow)"/>
      <line class="flow" x1="664" y1="168" x2="664" y2="232" marker-end="url(#arrow)"/>
      <line class="flow" x1="848" y1="168" x2="848" y2="232" marker-end="url(#arrow)"/>

      <!-- Labels beside the vertical segments -->
      <rect x="164" y="192" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="184" y="201" class="arrow-label">QUERY</text>
      <rect x="348" y="192" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="368" y="201" class="arrow-label">WRITE</text>
      <rect x="676" y="192" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="692" y="201" class="arrow-label">RUN</text>
      <rect x="860" y="192" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="876" y="201" class="arrow-label">LOG</text>

      <!-- Research agents -->
      <rect x="64" y="112" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="112" width="360" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="72" y="118" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="90" y="127" class="tag">AGENTS</text>
      <text x="244" y="140" class="node-name">searcher · merger · survey-differ · question-critic</text>
      <text x="244" y="156" class="sublabel">Read · Write under research/ · Bash → snowball.py only</text>

      <!-- Indexes -->
      <rect x="64" y="232" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="232" width="176" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="152" y="256" class="node-name">the indexes</text><text x="152" y="272" class="sublabel">S2 · OpenAlex · Crossref · arXiv</text>

      <!-- research/ -->
      <rect x="248" y="232" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="232" width="176" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="336" y="256" class="node-name">research/</text><text x="336" y="272" class="sublabel">sections · matrix · records</text>

      <!-- Experiment agents -->
      <rect x="576" y="112" width="360" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="112" width="360" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="584" y="118" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="602" y="127" class="tag">AGENTS</text>
      <text x="756" y="140" class="node-name">baseline-reproducer · experiment-designer · results-critic</text>
      <text x="756" y="156" class="sublabel">Bash · files · planned, not built</text>

      <!-- code and data -->
      <rect x="576" y="232" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="576" y="232" width="176" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="664" y="256" class="node-name">code and data</text><text x="664" y="272" class="sublabel">the repo, the datasets</text>

      <!-- notebook -->
      <rect x="760" y="232" width="176" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="232" width="176" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="848" y="256" class="node-name">notebook</text><text x="848" y="272" class="sublabel">logged before the result</text>

      <!-- The wall between the zones -->
      <rect x="468" y="164" width="64" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="468" y="164" width="64" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="500" y="192" class="node-name">guard</text><text x="500" y="208" class="sublabel">PreToolUse</text>

      <!-- Legend -->
      <line x1="40" y1="364" x2="960" y2="364" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="380" class="legend-head">LEGEND</text>
      <rect x="40" y="396" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="60" y="404" class="legend">built</text>
      <rect x="120" y="396" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><text x="140" y="404" class="legend">planned</text>
      <rect x="220" y="396" width="14" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/><text x="240" y="404" class="legend">enforced by a hook, not by prose</text>
      <text x="460" y="404" class="legend">The agent that runs the experiment cannot go find a paper that agrees with its result.</text>
    </svg>
