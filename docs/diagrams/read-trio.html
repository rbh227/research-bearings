<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The read trio</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399; --accent: #eb6c36; }
    body { font-family: 'Geist', system-ui, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    .node-name { font: 600 12px 'Geist', sans-serif; fill: #2d3142; text-anchor: middle; }
    .sublabel { font: 9px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; }
    .tag { font: 7px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.08em; }
    .arrow-label { font: 8px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.08em; }
    .zone-label { font: 7px 'Geist Mono', monospace; fill: rgba(45,49,66,0.55); text-anchor: middle; letter-spacing: 0.14em; }
    .legend { font: 8.5px 'Geist', sans-serif; fill: #4f5d75; }
    .legend-head { font: 8px 'Geist Mono', monospace; fill: #4f5d75; letter-spacing: 0.18em; }
    .ring { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
    .spoke { fill: none; stroke: #7a8399; stroke-width: 1; stroke-dasharray: 5,4; }
    .station { fill: #ffffff; stroke: #2d3142; stroke-width: 1; }
    .hub { fill: #2d3142; }
    .hub-name { font: 600 13px 'Geist', sans-serif; fill: #f5f5f5; text-anchor: middle; }
    .hub-sub { font: 9px 'Geist Mono', monospace; fill: rgba(245,245,245,0.75); text-anchor: middle; }
    .flow { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · research-bearings</p>
    <h1>Predictor, reader, scorer: three contexts, one card</h1>
    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trio-title trio-desc">
      <title id="trio-title">The read trio</title>
      <desc id="trio-desc">A paper is split. The predictor sees the abstract only and commits predictions. The reader sees the full text only and writes notes. The scorer sees both and writes the card, saying what was non-obvious.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="1000" height="420" fill="#f5f5f5"/>

      <!-- Arrows first -->
      <line class="flow" x1="168" y1="140" x2="256" y2="140" marker-end="url(#arrow)"/>
      <line class="flow" x1="168" y1="260" x2="256" y2="260" marker-end="url(#arrow)"/>
      <line class="flow" x1="400" y1="140" x2="472" y2="140" marker-end="url(#arrow)"/>
      <line class="flow" x1="400" y1="260" x2="472" y2="260" marker-end="url(#arrow)"/>
      <path class="flow" d="M600,140 H636 Q644,140 644,148 V184 Q644,192 652,192 H672" marker-end="url(#arrow)"/>
      <path class="flow" d="M600,260 H636 Q644,260 644,252 V216 Q644,208 652,208 H672" marker-end="url(#arrow)"/>
      <line class="flow" x1="816" y1="200" x2="856" y2="200" marker-end="url(#arrow)"/>

      <!-- Labels -->
      <rect x="188" y="120" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="212" y="129" class="arrow-label">ONLY</text>
      <rect x="188" y="240" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="212" y="249" class="arrow-label">ONLY</text>
      <rect x="404" y="120" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="434" y="129" class="arrow-label">COMMITS</text>
      <rect x="404" y="240" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="434" y="249" class="arrow-label">WRITES</text>
      <rect x="820" y="180" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="836" y="189" class="arrow-label">CARD</text>

      <!-- Abstract -->
      <rect x="40" y="112" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="112" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="104" y="136" class="node-name">Abstract</text><text x="104" y="152" class="sublabel">abstract and intro</text>

      <!-- Full text -->
      <rect x="40" y="232" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="232" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="104" y="256" class="node-name">Full text</text><text x="104" y="272" class="sublabel">the whole paper</text>

      <!-- predictor -->
      <rect x="256" y="112" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="112" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="264" y="118" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="280" y="127" class="tag">AGENT</text>
      <text x="328" y="144" class="node-name">predictor</text><text x="328" y="160" class="sublabel">never sees the body</text>

      <!-- reader -->
      <rect x="256" y="232" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="232" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="264" y="238" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="280" y="247" class="tag">AGENT</text>
      <text x="328" y="264" class="node-name">reader</text><text x="328" y="280" class="sublabel">never sees the prediction</text>

      <!-- prediction -->
      <rect x="472" y="112" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="112" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="536" y="136" class="node-name">prediction</text><text x="536" y="152" class="sublabel">written before reading</text>

      <!-- notes -->
      <rect x="472" y="232" width="128" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="472" y="232" width="128" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="536" y="256" class="node-name">notes</text><text x="536" y="272" class="sublabel">claim and delta</text>

      <!-- scorer -->
      <rect x="672" y="172" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="172" width="144" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="680" y="178" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="696" y="187" class="tag">AGENT</text>
      <text x="744" y="204" class="node-name">scorer</text><text x="744" y="220" class="sublabel">both; what was non-obvious</text>

      <!-- card -->
      <rect x="856" y="172" width="104" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="172" width="104" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="908" y="196" class="node-name">card</text><text x="908" y="212" class="sublabel">papers/&lt;slug&gt;.md</text>

      <!-- Legend -->
      <line x1="40" y1="364" x2="960" y2="364" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="380" class="legend-head">LEGEND</text>
      <rect x="40" y="396" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="60" y="404" class="legend">agent, its own context</text>
      <rect x="200" y="396" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="220" y="404" class="legend">text or file</text>
      <text x="360" y="404" class="legend">Separate contexts are the mechanism: the generator never judges its own guess.</text>
    </svg>
  </div>
</body>
</html>
