<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The research loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399; --accent: #eb6c36; }
    body { font-family: 'Geist', system-ui, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    .node-name { font: 600 12px 'Geist', sans-serif; fill: #2d3142; text-anchor: middle; }
    .sublabel { font: 9px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; }
    .tag { font: 7px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.08em; }
    .arrow-label { font: 8px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.08em; }
    .zone-label { font: 7px 'Geist Mono', monospace; fill: rgba(45,49,66,0.55); text-anchor: middle; letter-spacing: 0.14em; }
    .legend { font: 8.5px 'Geist', sans-serif; fill: #4f5d75; }
    .legend-head { font: 8px 'Geist Mono', monospace; fill: #4f5d75; letter-spacing: 0.18em; }
    .ring { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
    .spoke { fill: none; stroke: #7a8399; stroke-width: 1; stroke-dasharray: 5,4; }
    .station { fill: #ffffff; stroke: #2d3142; stroke-width: 1; }
    .hub { fill: #2d3142; }
    .hub-name { font: 600 13px 'Geist', sans-serif; fill: #f5f5f5; text-anchor: middle; }
    .hub-sub { font: 9px 'Geist Mono', monospace; fill: rgba(245,245,245,0.75); text-anchor: middle; }
    .flow { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Loop · research-bearings</p>
    <h1>The loop, and where a person decides</h1>
    <svg viewBox="0 0 1040 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="loop-title loop-desc">
      <title id="loop-title">The research loop and its three human gates</title>
      <desc id="loop-desc">Six stations run clockwise: frame, gather, read, ideate and rank, experiment, result, then back to frame. Every station writes into one folder, research/. Three stations carry a human gate: the question, which ideas survive, and whether to spend compute.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>
      <rect width="1040" height="700" fill="#f5f5f5"/>

      <!-- Ring: six arcs on one r=240 circle, clockwise, marker tip on the next station's edge -->
      <path class="ring" d="M600 113.726 A240 240 0 0 1 704.969 187.073" marker-end="url(#arrow)"/>
      <path class="ring" d="M743.285 252 A240 240 0 0 1 743.722 426.882" marker-end="url(#arrow)"/>
      <path class="ring" d="M705.731 492 A240 240 0 0 1 601.130 565.871" marker-end="url(#arrow)"/>
      <path class="ring" d="M440 566.274 A240 240 0 0 1 335.031 492.927" marker-end="url(#arrow)"/>
      <path class="ring" d="M296.715 428 A240 240 0 0 1 296.278 253.118" marker-end="url(#arrow)"/>
      <path class="ring" d="M334.269 188 A240 240 0 0 1 438.870 114.129" marker-end="url(#arrow)"/>

      <!-- Write-backs: every station writes one file into research/ -->
      <path class="spoke" d="M520 132 V280" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M672 252 L616 284" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M672 428 L616 396" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M520 548 V400" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M368 428 L424 396" marker-end="url(#arrow-soft)"/>
      <path class="spoke" d="M368 252 L424 284" marker-end="url(#arrow-soft)"/>

      <rect x="532" y="196" width="76" height="16" rx="2" fill="#f5f5f5"/>
      <text x="570" y="208" class="arrow-label">QUESTION.MD</text>
      <rect x="440" y="468" width="72" height="16" rx="2" fill="#f5f5f5"/>
      <text x="476" y="480" class="arrow-label">IDEAS.MD</text>

      <!-- Stations, clockwise from the top -->
      <rect class="station" x="440" y="68" width="160" height="64" rx="6"/>
      <rect x="448" y="74" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="464" y="83" class="tag">GATE</text>
      <text x="520" y="100" class="node-name">Frame</text><text x="520" y="118" class="sublabel">you approve the question</text>

      <rect class="station" x="648" y="188" width="160" height="64" rx="6"/>
      <text x="728" y="216" class="node-name">Gather</text><text x="728" y="236" class="sublabel">surveys · landscape · scout</text>

      <rect class="station" x="648" y="428" width="160" height="64" rx="6"/>
      <text x="728" y="456" class="node-name">Read</text><text x="728" y="476" class="sublabel">cards, three contexts</text>

      <rect class="station" x="440" y="548" width="160" height="64" rx="6"/>
      <rect x="448" y="554" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="464" y="563" class="tag">GATE</text>
      <text x="520" y="580" class="node-name">Ideate and rank</text><text x="520" y="598" class="sublabel">you pick which ideas survive</text>

      <rect class="station" x="232" y="428" width="160" height="64" rx="6"/>
      <rect x="240" y="434" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="256" y="443" class="tag">GATE</text>
      <text x="312" y="460" class="node-name">Experiment</text><text x="312" y="478" class="sublabel">you decide to spend compute</text>

      <rect class="station" x="232" y="188" width="160" height="64" rx="6"/>
      <text x="312" y="216" class="node-name">Result</text><text x="312" y="236" class="sublabel">a verdict; back to Frame</text>

      <!-- The one shared state -->
      <rect class="hub" x="420" y="288" width="200" height="104" rx="8"/>
      <text x="520" y="334" class="hub-name">research/</text>
      <text x="520" y="358" class="hub-sub">one folder, every file checkable</text>

      <!-- Legend -->
      <line x1="40" y1="644" x2="1000" y2="644" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="660" class="legend-head">LEGEND</text>
      <line x1="40" y1="682" x2="68" y2="682" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="76" y="685" class="legend">the loop, clockwise</text>
      <line x1="220" y1="682" x2="248" y2="682" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <text x="256" y="685" class="legend">writes a file into research/</text>
      <rect x="440" y="676" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="456" y="685" class="tag">GATE</text>
      <text x="480" y="685" class="legend">nothing downstream runs until a person says so</text>
    </svg>
  </div>
</body>
</html>
