<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The gathering fan-out</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399; --accent: #eb6c36; }
    body { font-family: 'Geist', system-ui, sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 800px; display: block; }
    .node-name { font: 600 12px 'Geist', sans-serif; fill: #2d3142; text-anchor: middle; }
    .sublabel { font: 9px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; }
    .tag { font: 7px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.08em; }
    .arrow-label { font: 8px 'Geist Mono', monospace; fill: #4f5d75; text-anchor: middle; letter-spacing: 0.08em; }
    .zone-label { font: 7px 'Geist Mono', monospace; fill: rgba(45,49,66,0.55); text-anchor: middle; letter-spacing: 0.14em; }
    .legend { font: 8.5px 'Geist', sans-serif; fill: #4f5d75; }
    .legend-head { font: 8px 'Geist Mono', monospace; fill: #4f5d75; letter-spacing: 0.18em; }
    .ring { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
    .spoke { fill: none; stroke: #7a8399; stroke-width: 1; stroke-dasharray: 5,4; }
    .station { fill: #ffffff; stroke: #2d3142; stroke-width: 1; }
    .hub { fill: #2d3142; }
    .hub-name { font: 600 13px 'Geist', sans-serif; fill: #f5f5f5; text-anchor: middle; }
    .hub-sub { font: 9px 'Geist Mono', monospace; fill: rgba(245,245,245,0.75); text-anchor: middle; }
    .flow { fill: none; stroke: #4f5d75; stroke-width: 1.2; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · research-bearings</p>
    <h1>One question in, seven searchers out, one matrix back</h1>
    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fan-title fan-desc">
      <title id="fan-title">The gathering fan-out</title>
      <desc id="fan-desc">QUESTION.md feeds the landscape skill, which shows seven queries and dispatches seven searchers in parallel. Each searcher runs the retrieval script, which queries Semantic Scholar and OpenAlex and writes one section. The merger reads only the sections and copies lines into the matrix.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>
      <rect width="1000" height="460" fill="#f5f5f5"/>

      <!-- Arrows first -->
      <line class="flow" x1="168" y1="212" x2="208" y2="212" marker-end="url(#arrow)"/>
      <line class="flow" x1="336" y1="212" x2="376" y2="212" marker-end="url(#arrow)"/>
      <line class="flow" x1="504" y1="212" x2="544" y2="212" marker-end="url(#arrow)"/>
      <path class="flow" d="M672,200 H684 Q692,200 692,192 V148 Q692,140 700,140 H712" marker-end="url(#arrow)"/>
      <path class="flow" d="M672,224 H684 Q692,224 692,232 V276 Q692,284 700,284 H712" marker-end="url(#arrow)"/>
      <line class="flow" x1="440" y1="244" x2="440" y2="316" marker-end="url(#arrow)"/>
      <line class="flow" x1="504" y1="340" x2="544" y2="340" marker-end="url(#arrow)"/>
      <line class="flow" x1="672" y1="340" x2="712" y2="340" marker-end="url(#arrow)"/>

      <!-- Arrow labels, 6px clear of the stroke -->
      <rect x="172" y="192" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="188" y="201" class="arrow-label">READ</text>
      <rect x="336" y="192" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="356" y="201" class="arrow-label">×7</text>
      <rect x="508" y="192" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="524" y="201" class="arrow-label">RUN</text>
      <rect x="448" y="272" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="468" y="281" class="arrow-label">WRITE</text>
      <rect x="500" y="320" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="524" y="329" class="arrow-label">READ</text>
      <rect x="668" y="320" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="692" y="329" class="arrow-label">COPY</text>

      <!-- QUESTION.md -->
      <rect x="40" y="180" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="180" width="128" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="48" y="186" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/><text x="62" y="195" class="tag">FILE</text>
      <text x="104" y="216" class="node-name">QUESTION.md</text><text x="104" y="232" class="sublabel">question · vocabulary</text>

      <!-- /landscape -->
      <rect x="208" y="180" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="208" y="180" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="216" y="186" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="232" y="195" class="tag">SKILL</text>
      <text x="272" y="216" class="node-name">/landscape</text><text x="272" y="232" class="sublabel">seven queries, one gate</text>

      <!-- searcher ×7 (a stack) -->
      <rect x="384" y="172" width="128" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="380" y="176" width="128" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.50)" stroke-width="1"/>
      <rect x="376" y="180" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="180" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="384" y="186" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="400" y="195" class="tag">AGENT</text>
      <text x="440" y="216" class="node-name">searcher</text><text x="440" y="232" class="sublabel">seven in parallel</text>

      <!-- snowball.py -->
      <rect x="544" y="180" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="180" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="552" y="186" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/><text x="570" y="195" class="tag">SCRIPT</text>
      <text x="608" y="216" class="node-name">snowball.py</text><text x="608" y="232" class="sublabel">neighborhood --write</text>

      <!-- Indexes -->
      <rect x="712" y="116" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="116" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="776" y="136" class="node-name">Semantic Scholar</text><text x="776" y="152" class="sublabel">1 rps with a key</text>
      <rect x="712" y="260" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="260" width="128" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="776" y="280" class="node-name">OpenAlex</text><text x="776" y="296" class="sublabel">the unkeyed pool</text>

      <!-- sections/ -->
      <rect x="376" y="316" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="376" y="316" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="440" y="336" class="node-name">sections/</text><text x="440" y="352" class="sublabel">one file per question</text>

      <!-- merger -->
      <rect x="544" y="316" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="316" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="608" y="336" class="node-name">merger</text><text x="608" y="352" class="sublabel">Read, Write only</text>

      <!-- matrix.md -->
      <rect x="712" y="316" width="128" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="712" y="316" width="128" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="776" y="336" class="node-name">matrix.md</text><text x="776" y="352" class="sublabel">each empty cell: a query</text>

      <!-- Legend -->
      <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="420" class="legend-head">LEGEND</text>
      <rect x="40" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="60" y="444" class="legend">skill, agent or script</text>
      <rect x="200" y="436" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="220" y="444" class="legend">file under research/</text>
      <rect x="360" y="436" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="380" y="444" class="legend">external index</text>
    </svg>
  </div>
</body>
</html>
